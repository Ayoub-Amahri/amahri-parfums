    <rect x="45" y="0" width="50" height="60" rx="10" fill="url(#capg)"/>
    <path d="M 10 60 Q 5 50 40 50 L 100 50 Q 135 50 130 60 L 150 400 Q 150 430 115 430 L 25 430 Q -10 430 -10 400 Z"
