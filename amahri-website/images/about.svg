      <stop offset="50%" stop-color="#8fb6c9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3a5568" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6a3f8f" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c9a3e0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6a3f8f" stop-opacity="0.9"/>
