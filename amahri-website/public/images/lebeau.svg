<svg viewBox="0 0 500 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#332310"/>
      <stop offset="100%" stop-color="#0d0904"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5a20" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#e0a94e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8a5a20" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6b8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="650" fill="url(#bg)"/>

  <!-- soft floor shadow -->
  <ellipse cx="250.0" cy="580" rx="140" ry="22" fill="#000000" opacity="0.35"/>

  <!-- bottle neck -->
  <rect x="228.0" y="143.0" width="44" height="55" rx="8" fill="url(#glass)" stroke="#a1701f" stroke-width="2"/>

  <!-- cap -->
  <rect x="216.0" y="73.0" width="68" height="78" rx="14" fill="url(#capGrad)" stroke="#7a5c15" stroke-width="1.5"/>
  <rect x="216.0" y="103.0" width="68" height="8" fill="#00000022"/>

  <!-- bottle body -->
  <path d="M 155.0 195.0
           Q 150.0 185.0 180.0 185.0
           L 320.0 185.0
           Q 350.0 185.0 345.0 195.0
           L 365.0 555
           Q 365.0 595 325.0 595
           L 175.0 595
           Q 135.0 595 135.0 555
           Z"
        fill="url(#glass)" stroke="#a1701f" stroke-width="3"/>

  <!-- glass shine -->
  <path d="M 155.0 195.0
           L 135.0 555
           Q 135.0 595 175.0 595
           L 195.0 595
           L 180.0 195.0
           Z" fill="url(#shine)"/>

  <!-- label plate -->
  <rect x="172.0" y="338.0" width="156" height="92" rx="6" fill="#0a0a0a" opacity="0.55" stroke="#d4af37" stroke-width="1.5"/>
  <text x="250.0" y="376.0" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="2" fill="#d4af37">LE BEAU</text>
  <text x="250.0" y="400.0" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#cfcfcf">AMAHRI</text>

  <!-- top highlight dot -->
  <circle cx="235.0" cy="98.0" r="4" fill="#ffffff" opacity="0.6"/>
</svg>